version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backupos
      POSTGRES_PASSWORD: backupos
      POSTGRES_DB: backupos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backupos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - cas_store:/app/cas_store
    environment:
      - DATABASE_URL=postgresql+asyncpg://backupos:backupos@postgres:5432/backupos
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-key-change-in-prod
      - CAS_STORE_PATH=/app/cas_store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
      - cas_store:/app/cas_store
    environment:
      - DATABASE_URL=postgresql+asyncpg://backupos:backupos@postgres:5432/backupos
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-key-change-in-prod
      - CAS_STORE_PATH=/app/cas_store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  cas_store:
